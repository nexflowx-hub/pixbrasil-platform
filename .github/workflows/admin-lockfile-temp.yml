name: Admin Lockfile Temp

on:
  push:
    branches: ["feat/admin-control-plane-web-v1"]
    paths:
      - "apps/admin/package.json"
      - ".github/workflows/admin-lockfile-temp.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/admin-control-plane-web-v1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Generate pinned admin lockfile
        working-directory: apps/admin
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- apps/admin/package-lock.json && git ls-files --error-unmatch apps/admin/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/admin/package-lock.json
          git commit -m "chore(admin): add deterministic lockfile"
          git push origin HEAD:feat/admin-control-plane-web-v1
