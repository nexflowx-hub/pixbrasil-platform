name: Web Quality

on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Intentionally schemeless to mirror a common Vercel env configuration.
      NEXT_PUBLIC_SITE_URL: "pixbrasil.org"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-audit-${{ github.sha }}
          path: test-results/**/landing-audit.png
          if-no-files-found: warn
          retention-days: 5
